<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Vinyl Record</title>
    <link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1815;
            --card-inner: #2d2924;
            --pen-ink: #f4f1ea;
            --accent-gold: #b8926a;
            --vinyl-texture: repeating-radial-gradient(circle, #000, #000 1px, #1a1a1a 4px, #000 5px);
        }

        body {
            background-color: var(--bg-color);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
            /* 優先順序：草寫 > iPhone楷體 > 標楷體 */
            font-family: 'Long Cang', 'STKaiti', 'KaiTi', 'BiauKai', cursive, serif;
            color: var(--pen-ink);
            -webkit-font-smoothing: antialiased;
        }

        .record-sleeve {
            position: relative;
            width: 100%; max-width: 750px; min-height: 420px;
            background: var(--card-inner);
            border-radius: 8px;
            display: flex; flex-direction: row; align-items: center;
            padding: 40px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.9);
            border: 1px solid #3d3932;
            cursor: pointer;
            z-index: 10;
            -webkit-tap-highlight-color: transparent;
        }

        .vinyl-disc {
            position: relative;
            width: 280px; height: 280px;
            background: var(--vinyl-texture);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            flex-shrink: 0;
            animation: spin 15s linear infinite;
            pointer-events: none;
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .center-label {
            width: 90px; height: 90px;
            background: #8b2626;
            border-radius: 50%; border: 4px solid #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff; font-size: 8px; font-family: 'Montserrat', sans-serif;
        }

        .text-area { 
            margin-left: 40px; 
            transition: opacity 0.5s; 
            flex-grow: 1; 
            pointer-events: none; 
        }
        .fade-out { opacity: 0; transform: translateY(5px); }

        .eng-title { 
            font-family: 'Montserrat', sans-serif;
            font-weight: 600; font-size: 11px; letter-spacing: 3px; 
            color: var(--accent-gold); margin-bottom: 15px; 
            border-left: 3px solid var(--accent-gold); padding-left: 12px;
            text-transform: uppercase;
        }

        .handwriting { 
            font-size: 1.6rem; 
            line-height: 1.6; 
            letter-spacing: 0.05rem;
            min-height: 150px;
            word-break: break-all;
        }

        #password-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.98);
            display: none; justify-content: center; align-items: center;
            z-index: 999;
            backdrop-filter: blur(15px);
        }

        .password-card {
            background: #222; padding: 40px 20px; border-radius: 20px; text-align: center;
            border: 1px solid var(--accent-gold); width: 85%; max-width: 300px;
        }

        .hint-text { 
            font-family: 'Long Cang', 'STKaiti', cursive;
            font-size: 1.8rem; color: var(--accent-gold);
            margin-bottom: 25px; letter-spacing: 0.3rem;
        }

        input {
            background: transparent; border: none; border-bottom: 1px solid var(--accent-gold);
            color: white; font-size: 32px; text-align: center; letter-spacing: 8px;
            width: 100%; outline: none; padding: 10px; border-radius: 0;
            font-family: 'Montserrat', sans-serif;
        }

        #end-box { display: none; text-align: center; width: 100%; margin-left: 0; }
        
        .replay-btn {
            margin-top: 30px; padding: 10px 20px; background: transparent;
            border: 1px solid var(--accent-gold); color: var(--accent-gold);
            cursor: pointer; letter-spacing: 3px; font-size: 10px;
            pointer-events: auto; font-family: 'Montserrat', sans-serif;
        }

        @media (max-width: 768px) {
            .record-sleeve { flex-direction: column; padding: 40px 25px; text-align: center; height: auto; }
            .vinyl-disc { width: 220px; height: 220px; margin-bottom: 30px; }
            .text-area { margin-left: 0; width: 100%; }
            .handwriting { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="record-sleeve" id="main-sleeve">
        <div class="vinyl-disc">
            <div class="center-label">
                <span>STEREO</span>
                <div style="width: 5px; height: 5px; background: #000; border-radius: 50%; margin: 6px 0;"></div>
                <span id="label-track">TRACK 01</span>
            </div>
        </div>

        <div class="text-area" id="content-box">
            <div class="eng-title" id="track-title">The Long Tour / Track 01</div>
            <div class="handwriting" id="track-text">
                生活就像一場長途巡演，<br>
                在切換到下一個樂章前，<br>
                請先卸下奔波的基調。<br>
                去看看你每天回家，<br>
                第一個放下「步伐」的地方。
            </div>
        </div>

        <div class="text-area" id="end-box">
            <div class="eng-title">Special Hidden Track</div>
            <div class="handwriting" style="font-size: 1.8rem;">這張唱片，獻給陪伴我巡演的你。<br><br>平安夜快樂。</div>
            <button class="replay-btn" id="replay-btn">REPLAY ALBUM</button>
        </div>
    </div>

    <div id="password-overlay">
        <div class="password-card" id="p-card">
            <p style="font-size: 10px; opacity: 0.6; letter-spacing: 3px; font-family: 'Montserrat', sans-serif;">ACCESS CODE</p>
            <div class="hint-text" id="pw-hint">相識</div>
            <input type="tel" id="pw-input" maxlength="6" placeholder="YYMMDD" autocomplete="off">
        </div>
    </div>

    <script>
        const tracks = [
            { title: "The Long Tour / Track 01", text: "生活就像一場長途巡演，<br>在切換到下一個樂章前，<br>請先卸下奔波的基調。<br>去看看你每天回家，<br>第一個放下「步伐」的地方。", pw: "250701", hint: "相識" },
            { title: "Analog Warmth / Track 02", text: "有些溫暖就像經典的類比錄音，<br>總是貼近心臟。<br>它曾在門外為你擋去雜訊與風雨；<br>現在，在那深處的夾層裡，<br>正藏著一段貼心變奏。", pw: "250712", hint: "初見" },
            { title: "Groove Details / Track 03", text: "尋找那些隱藏在溝槽間的細節。<br>就像音樂不只存在於封面，<br>最動人的旋律，<br>往往需要你親手放下唱針，<br>才能聽見那份共鳴。", pw: "250720", hint: "心動" },
            { title: "Dream Lullaby / Track 04", text: "當現實的雜音漸漸淡出，<br>夢境的弦樂即將響起。<br>去看看那個每晚承接你所有疲累思緒、<br>陪你進入安眠曲最深處的溫柔支撐。", pw: "250728", hint: "相戀" },
            { title: "The Final Beat / Track 05", text: "最後一個音符，並非固定在空間裡的陳設。<br>它正隨著一顆永遠支持你、<br>永遠為你心跳鼓掌的靈魂跳動著……", pw: "251224", hint: "今夕" }
        ];

        let currentIndex = 0;
        const mainSleeve = document.getElementById('main-sleeve');
        const overlay = document.getElementById('password-overlay');
        const pwInput = document.getElementById('pw-input');
        const pwHint = document.getElementById('pw-hint');
        const contentBox = document.getElementById('content-box');
        const endBox = document.getElementById('end-box');

        mainSleeve.onclick = function() {
            if (endBox.style.display === 'block') return;
            pwHint.innerText = tracks[currentIndex].hint;
            overlay.style.display = 'flex';
            setTimeout(() => { pwInput.focus(); }, 300);
        };

        pwInput.oninput = function() {
            if (this.value.length === 6) {
                if (this.value === tracks[currentIndex].pw) {
                    overlay.style.display = 'none';
                    const isLast = (currentIndex === tracks.length - 1);
                    this.value = '';
                    if (isLast) showFinalCredits(); else changeContent();
                } else {
                    document.getElementById('p-card').style.animation = "shake 0.4s";
                    this.value = '';
                    setTimeout(() => { document.getElementById('p-card').style.animation = ""; }, 400);
                }
            }
        };

        function changeContent() {
            contentBox.classList.add('fade-out');
            setTimeout(() => {
                currentIndex++;
                document.getElementById('track-title').innerText = tracks[currentIndex].title;
                document.getElementById('track-text').innerHTML = tracks[currentIndex].text;
                document.getElementById('label-track').innerText = `TRACK 0${currentIndex + 1}`;
                contentBox.classList.remove('fade-out');
            }, 500);
        }

        function showFinalCredits() {
            contentBox.classList.add('fade-out');
            setTimeout(() => {
                contentBox.style.display = 'none';
                endBox.style.display = 'block';
            }, 500);
        }

        document.getElementById('replay-btn').onclick = function(e) {
            e.stopPropagation();
            currentIndex = 0;
            endBox.style.display = 'none';
            contentBox.style.display = 'block';
            contentBox.classList.remove('fade-out');
            document.getElementById('track-title').innerText = tracks[0].title;
            document.getElementById('track-text').innerHTML = tracks[0].text;
            document.getElementById('label-track').innerText = `TRACK 01`;
        };

        overlay.onclick = function(e) {
            if (e.target === this) overlay.style.display = 'none';
        };
    </script>
    <style>
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    </style>
</body>
</html>
