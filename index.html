<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="theme-color" content="#1a1815">
	<title>The Premiere of Our Christmas</title>
    <link rel="apple-touch-icon" href="xmas.png">
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1815;
            --card-inner: #2d2924;
            --pen-ink: #f4f1ea;
            --accent-gold: #b8926a;
            --vinyl-texture: repeating-radial-gradient(circle, #000, #000 1px, #1a1a1a 4px, #000 5px);
        }

        body {
            background-color: var(--bg-color);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
            /* 關鍵：強制使用 iPhone 內建楷體，避免載入延遲 */
            font-family: 'STKaiti', 'KaiTi', 'BiauKai', 'Apple LiSung', serif;
            color: var(--pen-ink);
            -webkit-font-smoothing: antialiased;
        }

		/* 讓 Safari 介面更像 App 的秘訣 */
		html, body {
			height: -webkit-fill-available; /* 修正 iOS 100vh 的問題 */
			overflow: hidden; /* 防止頁面亂滾動 */
			position: fixed; /* 鎖定畫面，增加 App 感 */
			width: 100%;
		}

        .record-sleeve {
            position: relative;
            width: 100%; max-width: 750px; min-height: 420px;
            background: var(--card-inner);
            border-radius: 6px;
            display: flex; flex-direction: row; align-items: center;
            padding: 40px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.9);
            border: 1px solid #3d3932;
            cursor: pointer;
            z-index: 10;
            -webkit-tap-highlight-color: transparent;
			/* 調整高度，確保在有網址列的情況下也不會被切掉 */
			height: 85vh; 
			margin-top: env(safe-area-inset-top); /* 避開瀏海區 */
        }

        .vinyl-disc {
            position: relative;
            width: 280px; height: 280px;
            background: var(--vinyl-texture);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            flex-shrink: 0;
            <!--animation: spin 20s linear infinite;-->
			transition: transform 0.5s ease; /* 停止時平滑一點 */
			cursor: pointer;
            pointer-events: auto; /* 重要：讓圓盤可以被點擊 */
        }
		
		/* 當加上 playing 類別時才轉動 */
		.vinyl-disc.playing {
			animation: spin 15s linear infinite;
		}
		
		/* 暫停時的動畫處理 (選配：可讓它停在當前位置) */
		.vinyl-paused {
			animation-play-state: paused;
		}

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .center-label {
            width: 90px; height: 90px;
            background: #8b2626;
            border-radius: 50%; border: 4px solid #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff; font-size: 8px; font-family: 'Montserrat', sans-serif;
        }

        .text-area { 
            margin-left: 40px; 
            transition: opacity 0.5s; 
            flex-grow: 1; 
            pointer-events: none; 
        }
        .fade-out { opacity: 0; transform: translateY(5px); }

        .eng-title { 
            font-family: 'Montserrat', sans-serif;
            font-weight: 600; font-size: 10px; letter-spacing: 4px; 
            color: var(--accent-gold); margin-bottom: 20px; 
            border-left: 2px solid var(--accent-gold); padding-left: 12px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .handwriting { 
            /* 手寫感補強技術 */
            font-size: 1.4rem; 
            line-height: 2; 
            letter-spacing: 0.1rem;
            min-height: 150px;
            color: rgba(244, 241, 234, 0.9);
            /* 核心：輕微傾斜模擬人手習慣 */
            transform: skewX(-2deg);
            text-shadow: 0.5px 0.5px 1px rgba(255,255,255,0.1);
        }

        #password-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.98);
            display: none; justify-content: center; align-items: center;
            z-index: 999;
            backdrop-filter: blur(15px);
        }

        .password-card {
            background: #222; padding: 45px 25px; border-radius: 20px; text-align: center;
            border: 1px solid var(--accent-gold); width: 85%; max-width: 300px;
        }

        .hint-text { 
            font-size: 1.8rem; color: var(--accent-gold);
            margin-bottom: 25px; letter-spacing: 0.5rem;
            transform: skewX(-3deg); /* 提示文字也傾斜 */
        }

        input {
            background: transparent; border: none; border-bottom: 1px solid var(--accent-gold);
            color: white; font-size: 32px; text-align: center; letter-spacing: 10px;
            width: 100%; outline: none; padding: 10px; border-radius: 0;
            font-family: 'Montserrat', sans-serif;
        }

        #end-box { display: none; text-align: center; width: 100%; margin-left: 0; }
        
        .replay-btn {
            margin-top: 40px; padding: 10px 20px; background: transparent;
            border: 1px solid var(--accent-gold); color: var(--accent-gold);
            cursor: pointer; letter-spacing: 3px; font-size: 10px;
            pointer-events: auto; font-family: 'Montserrat', sans-serif;
        }

        @media (max-width: 768px) {
            .record-sleeve { flex-direction: column; padding: 50px 30px; text-align: center; height: auto; }
            .vinyl-disc { width: 230px; height: 230px; margin-bottom: 40px; }
            .text-area { margin-left: 0; width: 100%; }
            .handwriting { font-size: 1.25rem; line-height: 1.8; }
        }
    </style>
</head>
<body>
	<div id="start-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#1a1815; z-index:10000; display:flex; flex-direction:column; justify-content:center; align-items:center; transition: opacity 0.8s, visibility 0.8s;">
    
    <div style="width:250px; height:250px; 
            background-image:url('xmas-title2.png'); 
            background-size:cover; 
            background-position:center;
            border-radius:50%; 
            box-shadow: 0 0 40px rgba(0,0,0,0.8); 
            margin-bottom: 40px; 
            border: 3px solid #b8926a; 
            position: relative;
            display: flex; justify-content: center; align-items: center;">
    
    <div style="width: 60px; height: 60px; 
                background: rgba(26, 24, 21, 0.9); /* 深色半透明，看得到一點點底圖 */
                border-radius: 50%; 
                border: 1px solid #b8926a;
                display: flex; justify-content: center; align-items: center;">
        
        <div style="width: 8px; height: 8px; background: #b8926a; border-radius: 50%;"></div>
    </div>
</div>

    <button id="start-btn" style="background:transparent; border:1px solid #b8926a; color:#b8926a; padding:12px 40px; letter-spacing:5px; font-family:'Montserrat', sans-serif; font-size:14px; cursor:pointer; border-radius:30px; text-transform:uppercase;">Play Record</button>
</div>

	<audio id="bg-music" loop preload="auto" playsinline webkit-playsinline>
		<source src="music.mp3" type="audio/mpeg">
	</audio>

	
    <div class="record-sleeve" id="main-sleeve">
        <div class="vinyl-disc" id="vinyl-target">
            <div class="center-label">
                <span>TO</span>
                <div style="width: 5px; height: 5px; background: #000; border-radius: 50%; margin: 6px 0;"></div>
                <span id="label-track">CHARLES</span>
            </div>
        </div>

        <div class="text-area" id="content-box">
            <div class="eng-title" id="track-title">CHAPTER 01 / 相識</div>
            <div class="handwriting" id="track-text">
                生活就像一場長途巡演，<br>
                在切換到下一個樂章前，<br>
                請先卸下奔波的基調。<br>
                去看看你每天回家，<br>
                第一個放下「步伐」的地方。
            </div>
        </div>

        <div class="text-area" id="end-box">
            <div class="eng-title">Special Ending</div>
            <div class="handwriting" style="text-align: center; font-size: 1.6rem;">
                這張唱片，獻給陪伴我巡演的你。<br><br>
                <span style="color: var(--accent-gold);">平安夜快樂</span>
            </div>
            <button class="replay-btn" id="replay-btn">REPLAY ALBUM</button>
        </div>
    </div>

    <div id="password-overlay">
        <div class="password-card" id="p-card">
            <p style="font-size: 10px; opacity: 0.6; letter-spacing: 3px; font-family: 'Montserrat', sans-serif;">INPUT CODE</p>
            <div class="hint-text" id="pw-hint">相識</div>
            <input type="tel" id="pw-input" maxlength="6" placeholder="YYMMDD" autocomplete="off">
        </div>
    </div>

    <script>
        const tracks = [
            { title: "CHAPTER 01 / 相識", text: "生活就像一場長途巡演，<br>在切換到下一個樂章前，<br>請先卸下奔波的基調。<br>去看看你每天回家，<br>第一個放下「步伐」的地方。", pw: "250701", hint: "" },
            { title: "CHAPTER 02 / 初見", text: "有些溫暖就像經典的類比錄音，<br>總是貼近心臟。<br>它曾在門外為你擋去雜訊與風雨；<br>現在，在那深處的夾層裡，<br>正藏著一段貼心變奏。", pw: "250712", hint: "" },
            { title: "CHAPTER 03 / 心動", text: "尋找那些隱藏在溝槽間的細節。<br>就像音樂不只存在於封面，<br>最動人的旋律，<br>往往需要你親手放下唱針，<br>才能聽見那份共鳴。", pw: "250720", hint: "" },
            { title: "CHAPTER 04 / 相戀", text: "當現實的雜音漸漸淡出，<br>夢境的弦樂即將響起。<br>去看看那個每晚承接你所有疲累思緒、<br>陪你進入安眠曲最深處的溫柔支撐。", pw: "250728", hint: "" },
            { title: "CHAPTER 05 / 今夕", text: "最後一個音符，並非固定在空間裡的陳設。<br>它正隨著一顆永遠支持你、<br>永遠為你心跳鼓掌的靈魂跳動著……", pw: "251224", hint: "" }
        ];

        let currentIndex = 0;
        const mainSleeve = document.getElementById('main-sleeve');
        const overlay = document.getElementById('password-overlay');
        const pwInput = document.getElementById('pw-input');
        const pwHint = document.getElementById('pw-hint');
        const contentBox = document.getElementById('content-box');
        const endBox = document.getElementById('end-box');

		const music = document.getElementById('bg-music');
		const vinyl = document.getElementById('vinyl-target');
		const startBtn = document.getElementById('start-btn');
		const startOverlay = document.getElementById('start-overlay');

		// 啟動按鈕邏輯
		startBtn.onclick = function() {
			music.play().then(() => {
				vinyl.classList.add('playing'); // 讓黑膠開始轉
				startOverlay.style.opacity = '0'; // 封面淡出
				setTimeout(() => { 
					startOverlay.style.visibility = 'hidden'; 
				}, 800);
			}).catch(err => {
				console.log("播放失敗，請檢查靜音開關");
				startOverlay.style.visibility = 'hidden';
			});
		};

		// 邏輯 A：點擊黑膠唱片時 —— 控制轉動與音樂
		vinyl.onclick = function(e) {
			e.stopPropagation(); // 防止點擊唱片時也觸發下方的封套點擊
			
			if (music.paused) {
				music.play();
				vinyl.classList.add('playing');
				vinyl.style.animationPlayState = 'running';
			} else {
				music.pause();
				vinyl.style.animationPlayState = 'paused';
			}
		};

        // 邏輯 B：點擊整個封套（除了黑膠以外的地方）時 —— 彈出密碼窗
		mainSleeve.onclick = function(e) {
			// 如果點擊的是黑膠本人，就不在這邊重複跑彈窗邏輯（看你需求，通常彈窗跟音樂分開比較好）
			if (e.target === vinyl || vinyl.contains(e.target)) return;

			if (endBox.style.display === 'block') return;
			pwHint.innerText = tracks[currentIndex].hint;
			overlay.style.display = 'flex';
			setTimeout(() => { pwInput.focus(); }, 300);
		};

        pwInput.oninput = function() {
            if (this.value.length === 6) {
                if (this.value === tracks[currentIndex].pw) {
                    overlay.style.display = 'none';
                    const isLast = (currentIndex === tracks.length - 1);
                    this.value = '';
                    if (isLast) showFinalCredits(); else changeContent();
                } else {
                    document.getElementById('p-card').style.animation = "shake 0.4s";
                    this.value = '';
                    setTimeout(() => { document.getElementById('p-card').style.animation = ""; }, 400);
                }
            }
        };

        function changeContent() {
            contentBox.classList.add('fade-out');
            setTimeout(() => {
                currentIndex++;
                document.getElementById('track-title').innerText = tracks[currentIndex].title;
                document.getElementById('track-text').innerHTML = tracks[currentIndex].text;
                contentBox.classList.remove('fade-out');
            }, 500);
        }

        function showFinalCredits() {
            contentBox.classList.add('fade-out');
            setTimeout(() => {
                contentBox.style.display = 'none';
                endBox.style.display = 'block';
            }, 500);
        }

        document.getElementById('replay-btn').onclick = function(e) {
            e.stopPropagation();
            currentIndex = 0;
            endBox.style.display = 'none';
            contentBox.style.display = 'block';
            contentBox.classList.remove('fade-out');
            document.getElementById('track-title').innerText = tracks[0].title;
            document.getElementById('track-text').innerHTML = tracks[0].text;
        };

        overlay.onclick = function(e) {
            if (e.target === this) overlay.style.display = 'none';
        };
    </script>
    <style>
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    </style>
</body>
</html>
